[project]
name = "trino-mcp"
description = "Trino MCP implementation in Python"
version = "0.0.1"
readme = "README.md"
license = "MIT"
authors = [{ name = "Manh Luong", email = "luongquangmanh85@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.14,<5",
    "mcp>=2.0,<3",
    "pydantic>=2.12,<3",
    "sqlglot>=27,<28",
    "trino>=0.338,<1",
]

[dependency-groups]
dev = [
    "mcp[cli]>=2.0,<3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.65",
]

[project.scripts]
trino-mcp = "trino_mcp:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--cov=trino_mcp"
